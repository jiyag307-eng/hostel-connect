{% extends 'base.html' %}

{% block title %}Server Error (500) - HostelSphere{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 520px; margin: 3rem auto; padding: 3rem 2rem;">
  <div style="font-size: 4rem; line-height: 1; margin-bottom: 1rem;">⚠️</div>
  <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Internal Server Error</h1>
  <p style="color: var(--text-muted); margin-bottom: 1.75rem;">

  <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
