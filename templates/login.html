{% extends 'base.html' %}

{% block title %}Sign In - HostelSphere{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 3rem; height: 3rem; font-size: 1.5rem;">H</div>
      <h2 style="margin-bottom: 0.35rem;">Hostel Portal Sign In</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Enter your Roll Number or Admin Username to continue
      </p>
    </div>

    <!-- Quick Demo Accounts Button Strip -->
    <div style="background: #f1f5f9; border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem; text-align: center;">
      <span style="font-size: 0.775rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">
        ⚡ Demo Quick Fill
      </span>
      <div style="display: flex; gap: 0.5rem; justify-content: center;">
        <button type="button" class="btn btn-sm btn-secondary" onclick="fillCreds('25001003043', 'student123')">
          👤 Student (Jiyansh)
        </button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="fillCreds('admin', 'admin123')">
          🛡️ Warden (Admin)
        </button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Roll Number / Username</label>
        <input type="text" id="username" name="username" class="form-control" 
               placeholder="e.g. 25001003043 or admin" value="{{ username or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="password" style="margin: 0;">Password</label>
        </div>
        <input type="password" id="password" name="password" class="form-control" 
               placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
      <span style="color: var(--text-muted);">New hostel resident?</span>
      <a href="{{ url_for('register') }}" style="font-weight: 600; margin-left: 0.35rem;">Create Student Account &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillCreds(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}
</script>
{% endblock %}
